name: Deploy H5 (Tencent CVM)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          # lockfile 若指向内网源 repo.wuxingdev.cn，GitHub 无法 npm ci；CI 用公网重装
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build H5
        env:
          UNI_PLATFORM: h5
          VITE_H5_BASE: /m/
        run: npx uni build

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST}"

          test -f dist/build/h5/index.html
          if grep -q 'ART-CMS' dist/build/h5/index.html; then
            echo "FAIL: 构建产物像 PC 包，请确认 UNI_PLATFORM=h5"
            exit 1
          fi

          $SSH "mkdir -p /opt/art-training/mobile-h5"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            dist/build/h5/ "${SSH_USER}@${SSH_HOST}:/opt/art-training/mobile-h5/"

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            scripts/fix-nginx-m-h5.sh scripts/verify-m-h5-remote.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/"
          $SSH "sudo bash /tmp/fix-nginx-m-h5.sh && sudo bash /tmp/verify-m-h5-remote.sh"

          HTML=$(curl -fsSL "https://${SSH_HOST}/m/" | head -20)
          echo "$HTML"
          echo "$HTML" | grep -q '教务移动' || {
            echo "FAIL: 公网 /m/ 仍返回 PC 页（ART-CMS），Nginx 未生效"
            exit 1
          }
          echo "✅ H5: https://${SSH_HOST}/m/"
