name: Deploy H5 (Tencent CVM)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-h5.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          # lockfile 若指向内网源 repo.wuxingdev.cn，GitHub 无法 npm ci；CI 用公网重装
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build H5
        env:
          UNI_PLATFORM: h5
          VITE_H5_BASE: /m/
        run: npx uni build

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          # SSH 多为 IP；HTTPS 证书在域名上，公网/本机校验须用域名
          H5_PUBLIC_HOST: ${{ vars.H5_PUBLIC_HOST || 'orangeloveart.cn' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST}"

          test -f dist/build/h5/index.html
          if grep -q 'ART-CMS' dist/build/h5/index.html; then
            echo "FAIL: 构建产物像 PC 包，请确认 UNI_PLATFORM=h5"
            exit 1
          fi

          $SSH "mkdir -p /opt/art-training/mobile-h5"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            dist/build/h5/ "${SSH_USER}@${SSH_HOST}:/opt/art-training/mobile-h5/"

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            scripts/fix-nginx-m-h5.sh scripts/verify-m-h5-remote.sh scripts/diagnose-m-h5.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/"
          $SSH "sudo H5_PUBLIC_HOST=${H5_PUBLIC_HOST} bash /tmp/fix-nginx-m-h5.sh"

          echo "========== 服务器本机 HTTPS 校验（Host: ${H5_PUBLIC_HOST}）=========="
          HTML=$($SSH "curl -sSk -H 'Host: ${H5_PUBLIC_HOST}' 'https://127.0.0.1/m/'" | head -25)
          echo "$HTML"
          echo "$HTML" | grep -q '教务移动' || {
            echo "FAIL: 服务器 /m/ 仍返回 PC 页或 Nginx 未指向 mobile-h5"
            echo "请在服务器执行: sudo bash /tmp/diagnose-m-h5.sh"
            exit 1
          }

          echo "========== GitHub Runner 公网校验 =========="
          if HTML_PUB=$(curl -fsSL --connect-timeout 15 "https://${H5_PUBLIC_HOST}/m/" | head -25); then
            echo "$HTML_PUB"
            echo "$HTML_PUB" | grep -q '教务移动' || echo "WARN: 公网 HTML 异常，但服务器本机已通过"
          else
            echo "WARN: Runner 访问 https://${H5_PUBLIC_HOST}/m/ 失败（勿用 IP 做 HTTPS）；部署以服务器本机校验为准"
          fi
          echo "✅ H5: https://${H5_PUBLIC_HOST}/m/"
